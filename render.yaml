services:
  # CyberGuard Bénin - Application Tout-en-un (Frontend React + Backend Laravel)
  # 100% Gratuit, 1 seul service Web, 0 frais, sans carte bancaire
  - type: web
    name: cyberguard-app
    env: docker
    plan: free
    dockerContext: .
    dockerfilePath: Dockerfile
    healthCheckPath: /api/sante
    envVars:
      - key: PORT
        value: "10000"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        value: "base64:vFJ2uTLOeoOt6R/Ct3b20qdUn6TgQgNzTJipP+PXyk8="
      - key: DB_CONNECTION
        value: sqlite
      - key: QUEUE_CONNECTION
        value: sync
      - key: RUN_MIGRATIONS
        value: "true"
