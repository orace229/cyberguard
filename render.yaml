services:
  # 1. Frontend Web App (React + Nginx)
  - type: web
    name: cyberguard-frontend
    env: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: cyberguard-backend
          property: host

  # 2. Backend API (Laravel 11)
  - type: web
    name: cyberguard-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        fromService:
          type: web
          name: cyberguard-backend
          property: host
      - key: FRONTEND_URL
        fromService:
          type: web
          name: cyberguard-frontend
          property: host
      - key: SANCTUM_STATEFUL_DOMAINS
        fromService:
          type: web
          name: cyberguard-frontend
          property: host
      - key: DB_CONNECTION
        value: sqlite
      - key: QUEUE_CONNECTION
        value: database
      - key: RUN_MIGRATIONS
        value: "true"
      - key: APP_KEY
        generateValue: true

  # 3. Background Audit Queue Worker
  - type: worker
    name: cyberguard-queue
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    dockerCommand: php artisan queue:work --tries=1
    envVars:
      - key: APP_ENV
        value: production
      - key: DB_CONNECTION
        value: sqlite
      - key: QUEUE_CONNECTION
        value: database
      - key: RUN_MIGRATIONS
        value: "false"
      - key: APP_KEY
        fromService:
          type: web
          name: cyberguard-backend
          envVarKey: APP_KEY
